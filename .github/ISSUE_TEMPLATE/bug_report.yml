name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Cliplight version
      placeholder: "1.0.0"
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Run `log show --last 5m --predicate 'subsystem == \"local.cliplight.app\"'`. Cliplight never logs clipboard contents."
      render: text
